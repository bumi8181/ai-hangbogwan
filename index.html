<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 행보관</title>
<meta name="description" content="AI 행보관 — 중대 통합관리 시연용 대시보드 (가상 데이터)">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#fbf5ee;--bg2:#f6ece1;--card:#fffdfa;--line:#eee0d0;--line2:#e4d2bf;
  --ink:#3a2a1f;--ink2:#6f5a4a;--ink3:#a08b78;
  --acc1:#d9893f;--acc2:#a9502a;--acc:#bf6a32;--accSoft:#f8e7d6;
  --ok:#2f8a55;--okSoft:#e3f3e8;--bad:#c9443a;--badSoft:#fbe5e2;--warn:#b7791f;--warnSoft:#fbf0d9;
  --shadow:0 6px 22px rgba(120,72,30,.08);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--bg)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,#fdf8f2,#f8eee3)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc1),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(169,80,42,.3)}
.brand b{font-size:18px;letter-spacing:-.3px}
.brand small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.snav{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-weight:600;text-align:left}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:#f3e4d4}
.navbtn.on{background:var(--card);color:var(--acc2);box-shadow:var(--shadow)}
.sidefoot{position:absolute;bottom:18px;left:22px;right:18px;font-size:11px;color:var(--ink3);line-height:1.6}
.main{min-width:0;padding:0 28px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 14px;background:rgba(251,245,238,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:20px}
.top h1{margin:0;font-size:20px;letter-spacing:-.4px}
.top .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.topmob{display:none;align-items:center;gap:8px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--ink2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.topact{display:flex;gap:8px;align-items:center}
.tabbar{display:none}
.syncpill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.syncpill.live i{background:var(--ok);box-shadow:0 0 0 3px var(--okSoft)}.syncpill.saving i,.syncpill.loading i{background:var(--warn)}.syncpill.error i{background:var(--bad)}

/* ── 공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card h2{margin:0;font-size:17px;letter-spacing:-.3px}
.card h3{margin:18px 0 10px;font-size:15px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--ink3);font-size:13px}
.small{font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-top:16px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;color:var(--ink2)}
.btn:hover{background:#fbf1e6}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 6px 16px rgba(169,80,42,.25)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.del{color:var(--bad);border-color:#f0c8c3}
.btn.del:hover{background:var(--badSoft)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okSoft);color:var(--ok)}.p-bad{background:var(--badSoft);color:var(--bad)}.p-warn{background:var(--warnSoft);color:var(--warn)}.p-acc{background:var(--accSoft);color:var(--acc2)}.p-gray{background:#f1e9e0;color:var(--ink2)}
.note{padding:12px 14px;border-radius:14px;background:var(--bg2);color:var(--ink2);font-size:13px;line-height:1.55}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.field{display:block;font-size:13px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:#fff;outline:none}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.form{display:grid;gap:12px}
.form.row4{grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:end}
.form.row3{grid-template-columns:2fr 1fr 1fr auto;align-items:end}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f9f0e6;color:var(--ink2);font-weight:700;font-size:12px}
tr:last-child td{border-bottom:0}
td select{padding:6px 8px;border:1px solid var(--line2);border-radius:9px;background:#fff}
tfoot th{background:#f4e6d6}
.num{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.num button{border:0;background:#faf1e7;width:34px;height:36px;font-weight:800;color:var(--acc2)}
.num button:hover{background:var(--accSoft)}
.num input{width:72px;height:36px;border:0;text-align:center;font-weight:700;outline:none;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.mini{width:76px;padding:7px 8px;border:1px solid var(--line2);border-radius:9px;text-align:center;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:13px}

/* ── 대시보드 ── */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 28px;border-radius:24px;background:radial-gradient(120% 140% at 100% 0%,#f6d7b6 0%,#fbeee0 45%,#fffaf4 100%);border:1px solid var(--line)}
.hero .date{font-size:13px;color:var(--ink2);font-weight:600}
.hero .tag{margin:12px 0 4px;font-size:15px;color:var(--ink2);line-height:1.5}
.hero h2{margin:0;font-size:34px;letter-spacing:-1px}
.hero .heroBtns{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.ring{--p:0;flex:none;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#f1e1cf 0);display:grid;place-items:center}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;display:block;letter-spacing:-1px}
.ring span{font-size:12px;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.kpi{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);transition:.15s}
.kpi.click:hover{transform:translateY(-2px);border-color:var(--acc)}
.kpi.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.kpi .lb{font-size:12px;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between;gap:4px}
.kpi b{display:block;font-size:28px;margin-top:6px;letter-spacing:-1px}
.kpi b small{font-size:14px;color:var(--ink3);font-weight:600;margin-left:2px}
.kpi.alert b{color:var(--bad)}
.kpi .more{font-size:11px;color:var(--acc);font-weight:700}
.health{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.hcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:.15s}
.hcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.hcard .h{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.hcard .nums{display:flex;gap:16px;margin:12px 0 10px}
.hcard .nums div{font-size:12px;color:var(--ink3);font-weight:700}
.hcard .nums b{display:block;font-size:24px;letter-spacing:-.5px}
.bar{display:flex;height:10px;border-radius:9px;overflow:hidden;background:#f1e4d6}
.bar i{display:block;height:100%}
.bar .o{background:var(--ok)}.bar .x{background:var(--bad)}
.hcard .foot{margin-top:10px;font-size:12px;color:var(--acc2);font-weight:700}
.map{border-radius:18px;padding:14px;background:#eaf0e0;border:1px solid #d9e2cb}
.blds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.bld{border:1.5px solid #cdbba7;border-radius:12px;background:#fffdf9;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink);min-height:66px;justify-content:center;transition:.12s;text-align:center}
.bld:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.bld .e{font-size:20px}
.bld .s{font-size:11px;font-weight:700}
.bld.ok{border-color:#8cc59f}.bld.ok .s{color:var(--ok)}
.bld.bad{border-color:var(--bad);background:#fff5f3}.bld.bad .s{color:var(--bad)}
.road{height:22px;margin:10px 0;border-radius:6px;background:#b9b1a5;color:#fff;font-size:11px;letter-spacing:6px;display:grid;place-items:center}
.feed{display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:left;width:100%}
.fitem:hover{border-color:var(--acc)}
.fitem .ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px}
.fitem b{font-size:13px;display:block}
.fitem span{font-size:12px;color:var(--ink3)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.chk.done span{color:var(--ink3);text-decoration:line-through}
.chk .x{margin-left:auto}

/* ── 주차장 (4열 × 10면) ── */
.lotwrap{overflow-x:auto;border-radius:18px;-webkit-overflow-scrolling:touch}
.lot{position:relative;min-width:700px;padding:16px 18px 16px 52px;border-radius:18px;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.035) 0 2px,transparent 3px) 0 0/22px 22px,
  radial-gradient(circle at 70% 60%,rgba(0,0,0,.12) 0 1.5px,transparent 2.5px) 0 0/17px 17px,
  linear-gradient(180deg,#43484d,#383c41);
  border:6px solid #8d8a83;box-shadow:inset 0 0 0 2px #2c2f33,0 10px 30px rgba(0,0,0,.18)}
.lrow{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}
.rlabel{position:absolute;left:-44px;top:50%;transform:translateY(-50%);width:36px;text-align:center;font-size:11px;font-weight:800;color:#e9e3d7;background:rgba(0,0,0,.28);border-radius:8px;padding:5px 0;letter-spacing:.5px}
.stall{position:relative;height:96px;border:0;background:transparent;padding:0;border-left:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;transition:background .15s}
.stall:last-child{border-right:2px solid rgba(255,255,255,.85)}
.stall.dn{border-top:2px solid rgba(255,255,255,.85)}
.stall.up{border-bottom:2px solid rgba(255,255,255,.85)}
.stall:hover{background:rgba(255,255,255,.07)}
.stall .no{position:absolute;z-index:1;text-shadow:0 1px 2px #000;left:0;right:0;font-size:15px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.5px;text-align:center;pointer-events:none}
.stall.dn .no{top:8px}.stall.up .no{bottom:8px}
.stall.fill .no{left:4px;right:auto;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:1px 5px;border-radius:5px;text-shadow:none}
.stall .vac{font-size:10px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:2px}
.stall .veh{max-height:92px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.stall.dn .veh{transform:rotate(180deg)}
.stall .plate{position:absolute;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:#f4f1ea;color:#222;border-radius:3px;padding:1px 4px;white-space:nowrap}
.stall.dn .plate{bottom:5px}.stall.up .plate{top:5px}
.stall.bad{background:rgba(201,68,58,.22)}
.stall.bad::after{content:"";position:absolute;inset:6px;border:2px solid #ff8a7f;border-radius:8px;animation:pulse 1.4s infinite}
.stall.sel{background:rgba(255,199,107,.2);box-shadow:inset 0 0 0 3px #ffc76b}
@keyframes pulse{50%{opacity:.25}}
.aisle{position:relative;height:50px;display:flex;align-items:center;justify-content:space-around;color:rgba(255,255,255,.35);font-size:18px;font-weight:900}
.aisle::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #e8c547;opacity:.8}
.aisle span{position:relative;background:#3d4146;padding:0 8px;line-height:1}
.median{height:12px;margin:0 -2px;border-radius:6px;background:repeating-linear-gradient(90deg,#e8c547 0 14px,#2b2b2b 14px 28px);opacity:.85}
.gate{position:absolute;right:-6px;top:50%;transform:translate(0,-50%);background:#e8c547;color:#2b2b2b;font-size:11px;font-weight:900;padding:8px 4px;border-radius:6px 0 0 6px;writing-mode:vertical-rl;letter-spacing:3px}
.lot.compact{min-width:0;padding:10px 10px 10px 40px;border-width:4px}
.lot.compact .stall{height:62px}
.lot.compact .stall .no{font-size:11px}.lot.compact .stall.dn .no{top:4px}.lot.compact .stall.up .no{bottom:4px}
.lot.compact .vac,.lot.compact .plate{display:none}
.lot.compact .veh{transform:scale(.6)}.lot.compact .stall.dn .veh{transform:rotate(180deg) scale(.6)}
.lot.compact .aisle{height:30px;font-size:13px}
.lot.compact .median{height:8px}
.lot.compact .rlabel{left:-34px;width:28px;font-size:10px}
.lot.compact .gate{font-size:9px;padding:5px 2px}
.sumline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.si{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 4px;border:0;border-left:1px solid var(--line);background:transparent;text-align:center;min-width:0}
.si:first-child{border-left:0}
button.si:hover{background:#fbf1e6}
.si span{font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap}
.si b{font-size:26px;letter-spacing:-1px;line-height:1.1}
.si b em{font-style:normal;font-size:13px;color:var(--ink3);font-weight:600;margin-left:2px;letter-spacing:0}
.si.alert b{color:var(--bad)}
.mapstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.ms{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px}
.ms:hover{border-color:var(--acc)}
.ms .mh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;font-size:13px}
.ms .bar{height:7px}
.ms .mf{margin-top:6px;font-size:11px;color:var(--ink3);font-weight:700}
.blds.b6{grid-template-columns:repeat(6,minmax(0,1fr))}
.bld.warn{border-color:#e0a24a;background:#fffaf0}.bld.warn .s{color:var(--warn)}
.vpick{display:flex;gap:12px;align-items:center}
.vprev{width:92px;height:150px;flex:none;border-radius:12px;background:#3d4146;display:grid;place-items:center;text-align:center;color:#aaa}
.vprev .muted{color:#c9c9c9}
.vgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.vg{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.vgimg{width:100%;height:132px;border-radius:12px;background:linear-gradient(180deg,#43484d,#383c41);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.vgimg .veh{filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.vg b{font-size:13px}.vg span{font-size:11px;color:var(--ink3);font-weight:700}
.lotlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.lotlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── 3D 창고 ── */
.wh3d{--s:1;position:relative;height:calc(470px*var(--s));border-radius:20px;overflow:hidden;background:#1d1b19;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage{position:absolute;left:var(--ox,0px);top:0;width:760px;height:470px;transform:scale(var(--s));transform-origin:0 0;perspective:900px;perspective-origin:50% 36%;cursor:grab}
.stage:active{cursor:grabbing}
.room{position:absolute;left:0;top:44px;width:760px;height:400px;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.room.drag{transition:none}
.room,.room *{pointer-events:none}
.room .bx,.room .bx *{pointer-events:auto}
.wall,.floor,.ceil{position:absolute;transform-style:preserve-3d}
.wall{background:linear-gradient(180deg,#cfc8bc 0%,#c4bcae 70%,#b2a998 100%)}
.wall::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:#a39a8b}
.wall .wlabel{position:absolute;left:12px;top:1px;font-size:10px;font-weight:800;color:#fff;letter-spacing:2px;opacity:.85}
.wall.back{left:0;top:0;width:760px;height:400px;transform:translateZ(-460px);background:linear-gradient(180deg,#d6d0c5,#c7bfb1 75%,#b6ad9c)}
.wall.left{left:0;top:0;width:460px;height:400px;transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#bdb5a6,#cec7ba)}
.wall.right{left:300px;top:0;width:460px;height:400px;transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(90deg,#cec7ba,#bdb5a6)}
.floor{left:0;top:-56px;width:760px;height:460px;transform-origin:50% 100%;transform:rotateX(90deg);background:
  linear-gradient(90deg,transparent 0 92px,#e3b93a 92px 98px,transparent 98px calc(100% - 98px),#e3b93a calc(100% - 98px) calc(100% - 92px),transparent 0),
  linear-gradient(0deg,transparent 0 92px,#e3b93a 92px 98px,transparent 0),
  repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 76px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 76px),
  radial-gradient(ellipse at 50% 30%,#a9a296,#8f887c)}
.ceil{left:0;top:0;width:760px;height:460px;transform-origin:50% 0;transform:rotateX(-90deg);background:

/* ───────── 주차장: 4열 × 10면 ───────── */
function lotHTML(sel,compact){
  const stall=(s,dir)=>{const v=car(s),bad=v.number&&(isBad(v.state)||!v.mission);
    const click=sel?`carSlot=${s};draw()`:`openSheet(()=>sheetCar(${s}))`;
    return `<button class="stall ${dir} ${v.number?'fill':''} ${bad?'bad':''} ${sel&&s===carSlot?'sel':''}" onclick="${click}" title="${s}번 주차면${v.number?' · '+esc(v.number):' · 빈 칸'}"><span class="no">${s}</span>${v.number?vehSVG(v.type)+`<span class="plate">${esc(v.number)}</span>`:'<span class="vac">EMPTY</span>'}</button>`};
  const row=(from,dir,label)=>`<div class="lrow"><span class="rlabel">${label}</span>${Array.from({length:10},(_,i)=>stall(from+i,dir)).join('')}</div>`;
  const aisle='<div class="aisle"><span>›</span><span>›</span><span>›</span><span>›</span><span>›</span></div>';
  return `<div class="lotwrap"><div class="lot ${compact?'compact':''}">${row(1,'dn','1열')}${aisle}${row(11,'up','2열')}<div class="median"></div>${row(21,'dn','3열')}${aisle.replace(/›/g,'‹')}${row(31,'up','4열')}<span class="gate">입구</span></div></div>
  <div class="lotlegend"><span><i style="background:#3d4146"></i>빈 칸</span><span><i style="background:#4f5a34"></i>주차 차량</span><span><i style="background:#c9443a"></i>고장·임무불가</span></div>`;
}
function taskList(){return db.tasks.map((t,i)=>`<label class="chk ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="db.tasks[${i}].done=this.checked;commit()"><span>${esc(t.text)}</span><button class="btn sm del x" onclick="event.preventDefault();db.tasks.splice(${i},1);commit()">삭제</button></label>`).join('')||'<div class="empty">업무가 없습니다</div>'}

/* ───────── 인사 ───────── */
function person(){
  const list=roomNo?db.people.filter(p=>p.room===roomNo):db.people;
  return `
  <div class="card"><div class="chead"><h2>➕ 인원 추가</h2><span class="muted">현재 총원 ${db.people.length}명</span></div>
    <div class="form row4">
      <label class="field">성명<input id="nName" maxlength="20" placeholder="예: 김철수" onkeydown="if(event.key==='Enter')addPerson()"></label>

      <label class="field">생활관<select id="nRoom">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${roomNo===i+1?'selected':''}>${i+1}생활관</option>`).join('')}</select></label>
      <label class="field">상태<select id="nStatus">${opts(STATUS,'임무수행가능')}</select></label>

    <div class="seg"><button class="${roomNo===0?'on':''}" onclick="roomNo=0;draw()">전체</button>${Array.from({length:10},(_,i)=>`<button class="${roomNo===i+1?'on':''}" onclick="roomNo=${i+1};draw()">${i+1}생활관</button>`).join('')}</div>
    <div class="stat7" style="grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:14px">${STATUS.map(s=>`<button onclick="${s==='임무수행가능'?'':`leaveFilter='${s}';openSheet(sheetLeave)`}"><b>${list.filter(p=>p.status===s).length}</b>${s==='임무수행가능'?'가능':s}</button>`).join('')}</div>
    <div class="tw"><table><thead><tr><th>번호</th><th>성명</th><th>계급</th><th>상태</th><th>생활관</th><th></th></tr></thead><tbody id="ptable">${personRows()}</tbody></table></div>
  </div>`;
}
function personRows(){
  const q=query.trim();
  const list=db.people.filter(p=>(!roomNo||p.room===roomNo)&&(!q||p.name.includes(q)));
  return list.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td><select onchange="setP(${p.id},'rank',this.value)">${opts(RANK,p.rank)}</select></td><td><select onchange="setP(${p.id},'status',this.value)" style="${p.status!=='임무수행가능'?'color:var(--warn);font-weight:700':''}">${opts(STATUS,p.status)}</select></td><td><select onchange="setP(${p.id},'room',Number(this.value))">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${p.room===i+1?'selected':''}>${i+1}생활관</option>`).join('')}</select></td><td><button class="btn sm del" onclick="delPerson(${p.id})">삭제</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">해당 인원이 없습니다</td></tr>`;
}
function setP(id,k,v){const p=db.people.find(x=>x.id===id);if(!p)return;p[k]=v;commit()}
function addPerson(){
  const name=$('nName').value.trim();if(!name)return alert('성명을 입력하세요');
  const id=db.people.reduce((m,p)=>Math.max(m,p.id),0)+1;
  db.people.push({id,name,rank:$('nRank').value,room:Number($('nRoom').value),status:$('nStatus').value,weapon:'미지급',bayonet:'미지급'});
  commit();
}
function delPerson(id){const p=db.people.find(x=>x.id===id);if(!p||!confirm(`${p.rank} ${p.name} 인원을 명부에서 삭제할까요?`))return;db.people=db.people.filter(x=>x.id!==id);commit()}

/* ───────── 군수(통합) ───────── */

  const tile=(t,big,sub,low,tab)=>`<button class="kpi click ${low?'alert':''} ${supTab===tab?'sel':''}" onclick="supTab='${tab}';draw()"><div class="lb"><span>${t}</span>${low?pill('부족 '+low,'bad'):''}</div><b>${big}</b><div class="muted small">${sub}</div></button>`;

    ${Object.keys(WH).map(k=>tile(`${WH[k].icon} ${WH[k].name}`,`${usedBoxes(k)}<small>/60 박스</small>`,`품목 ${db.wh[k].items.length}종`,lowOf(k),k)).join('')}
    <button class="kpi click ${supTab==='all'?'sel':''}" onclick="supTab='all';draw()"><div class="lb"><span>📋 총괄표</span></div><b>${allItems().length}<small>종</small></b><div class="muted small">전체 품목 한눈에</div></button>
  </div>
  <div class="seg" style="margin-top:16px">${tabs.map(([k,t])=>`<button class="${supTab===k?'on':''}" onclick="supTab='${k}';draw()">${t}</button>`).join('')}</div>${body}`;
}
function whPage(k){
  return `<div class="card"><div class="chead"><h2>${WH[k].icon} ${WH[k].name} 3D 현황</h2><span class="muted">박스를 누르면 내용물이 나옵니다</span></div>
    ${k==='ammo'?'<div class="note" style="margin-bottom:12px">가상 장부상 수량만 관리합니다. 실제 보관 위치·출입·보안 정보는 다루지 않습니다.</div>':''}
    ${wh3dHTML(k)}
    <div class="whlegend"><span><i style="background:${WH[k].color}"></i>적재 박스</span><span><i style="border:1.5px dashed #9b8b78"></i>빈 칸 (눌러서 넣기)</span><span><i style="background:#d63a2f"></i>부족 품목</span><span><i style="background:#ffd36b"></i>선택한 박스</span></div>
  </div>
  <div class="card"><div class="chead"><h2>품목별 합계</h2><span class="muted">보유 수량 = 해당 품목이 든 박스 수량의 합</span></div>${itemTable(k,true)}
    <h3>새 품목 등록</h3><div class="form row3"><label class="field">품명<input id="iName" maxlength="40"></label><label class="field">기준 수량<input id="iMin" type="number" min="0" value="10"></label><label class="field">단위<input id="iUnit" maxlength="4" value="개"></label><button class="btn pri" style="height:43px" onclick="addItem('${k}')">등록</button></div>
    <p class="muted small">등록한 품목은 빈 박스를 눌러 넣을 수 있습니다.</p></div>`;
}

/* 3D 창고 렌더링 */
function wh3dHTML(k){
  const lowNames=new Set(whItems(k).filter(x=>x.qty<x.min).map(x=>x.name));
  const box=(w,l,c,size)=>{const id=`${w}-${l}-${c}`,b=db.wh[k].boxes[id],s=selBox===k+':'+id?'sel':'';
    const st=`--bw:${size.bw}px;--bh:${size.bh}px;--bd:${size.bd}px;--fs:${size.fs}px`;
    if(!b)return `<div class="slot"><button class="bx empty ${s}" style="${st}" onclick="boxClick('${k}','${id}')" title="${wallName(w)} ${l}층 ${c}번 · 빈 칸"><i class="fr">+</i></button></div>`;
    return `<div class="slot"><button class="bx ${s}" style="${st}" onclick="boxClick('${k}','${id}')" title="${wallName(w)} ${l}층 ${c}번 · ${esc(b.item)} ${b.qty}"><i class="tp"></i><i class="sl"></i><i class="sr"></i><i class="fr"><span class="code">${l}-${c}</span><b>${esc(b.item.replace('(가상)',''))}</b><em>${fmt(b.qty)}</em>${lowNames.has(b.item)?'<span class="lowtag">부족</span>':''}</i></button></div>`};
  const rack=(w,size)=>{let h='';for(let l=LV;l>=1;l--){const cols=Array.from({length:COLS},(_,i)=>w==='R'?COLS-i:i+1);h+=`<div class="lvl"><span class="plank"></span><span class="beam"></span><span class="lvno">${l}F</span>${cols.map(c=>box(w,l,c,size)).join('')}</div>`}return `<div class="rack"><span class="post l"></span><span class="post r"></span>${h}</div>`};
  const back={bw:112,bh:62,bd:46,fs:11},side={bw:64,bh:62,bd:46,fs:9};
  return `<div class="wh3d" id="wh3d"><div class="wh-name">${WH[k].icon} ${WH[k].name} · ${usedBoxes(k)}/60 박스</div>
   <div class="wh-ctrl"><button onclick="rotWh(-22)">◀ 좌측</button><button onclick="whRot={x:0,y:0};applyRot()">정면</button><button onclick="rotWh(22)">우측 ▶</button></div>
   <div class="wh-hint">드래그해서 둘러보기 · 박스를 눌러 내용물 확인</div>
   <div class="stage" id="stage"><div class="room t-${k}" id="room">
     <div class="ceil"></div><div class="floor"></div>
     <div class="wall back"><span class="wlabel">정면</span>${rack('B',back)}</div>
     <div class="wall left"><span class="wlabel">좌측</span>${rack('L',side)}</div>
     <div class="wall right"><span class="wlabel" style="left:auto;right:12px">우측</span>${rack('R',side)}</div>
   </div></div></div>`;
}
let drag=null,dragMoved=false;
function applyRot(){const r=$('room');if(r)r.style.transform=`translateZ(-230px) rotateX(${whRot.x}deg) rotateY(${whRot.y}deg) translateZ(230px)`}
function rotWh(d){whRot.y=Math.max(-38,Math.min(38,whRot.y+d));applyRot()}
function setWhScale(){const w=$('wh3d');if(!w)return;const W=w.clientWidth,s=Math.min(1.3,Math.max(W/760,Math.min(1,W/540)));w.style.setProperty('--s',s);w.style.setProperty('--ox',((W-760*s)/2)+'px')}
function initWh(){const st=$('stage');if(!st)return;setWhScale();applyRot();
  st.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,rx:whRot.x,ry:whRot.y};dragMoved=false};}
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!dragMoved&&Math.abs(dx)+Math.abs(dy)<6)return;dragMoved=true;$('room')?.classList.add('drag');whRot.y=Math.max(-38,Math.min(38,drag.ry+dx*.18));whRot.x=Math.max(-14,Math.min(10,drag.rx-dy*.1));applyRot()});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=null;$('room')?.classList.remove('drag');setTimeout(()=>dragMoved=false,0)});
window.addEventListener('resize',setWhScale);
function boxClick(k,id){if(dragMoved)return;selBox=k+':'+id;openSheet(()=>sheetBox(k,id));draw()}

function itemTable(k,full){
  const a=whItems(k);
  if(!a.length)return '<div class="empty">등록된 품목이 없습니다</div>';
  return `<div class="tw"><table><thead><tr><th>품명</th><th>보유</th><th>기준</th><th>박스</th><th>상태</th>${full?'<th></th>':''}</tr></thead><tbody>${a.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td><b>${fmt(x.qty)}</b> <span class="muted small">${esc(x.unit||'')}</span></td><td><input class="mini" type="number" min="0" value="${x.min}" onchange="setMin('${k}',${i},this.value)"></td><td>${x.boxIds.length? `<span class="chips">${x.boxIds.slice(0,4).map(id=>`<button onclick="selBox='${k}:${id}';supTab='${k}';openSheet(()=>sheetBox('${k}','${id}'));if(view!=='supply')go('supply');else draw()">${boxLabel(id)}</button>`).join('')}${x.boxIds.length>4?`<span class="muted small">외 ${x.boxIds.length-4}</span>`:''}</span>`:'<span class="muted small">없음</span>'}</td><td>${x.qty<x.min?pill('부족 '+fmt(x.min-x.qty),'bad'):pill('정상','ok')}</td>${full?`<td><button class="btn sm del" onclick="delItem('${k}',${i})">삭제</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
const boxLabel=id=>{const [w,l,c]=id.split('-');return `${wallName(w)} ${l}층 ${c}`};
function setMin(k,i,v){db.wh[k].items[i].min=toInt(v);commit()}
function delItem(k,i){const it=db.wh[k].items[i],n=Object.values(db.wh[k].boxes).filter(b=>b.item===it.name).length;
  if(!confirm(`'${it.name}' 품목을 삭제할까요?${n?`\n이 품목이 든 박스 ${n}개도 비워집니다.`:''}`))return;
  for(const [id,b] of Object.entries(db.wh[k].boxes))if(b.item===it.name)delete db.wh[k].boxes[id];

function addItem(k){const name=$('iName').value.trim();if(!name)return alert('품명을 입력하세요');if(db.wh[k].items.some(x=>x.name===name))return alert('이미 있는 품목입니다');db.wh[k].items.push({name,min:toInt($('iMin').value),unit:$('iUnit').value.trim()||'개'});commit()}
/* 박스 편집 */
function setBoxItem(k,id,name){const bx=db.wh[k].boxes;if(!name){delete bx[id]}else{const old=bx[id];bx[id]={item:name,qty:old?old.qty:0,note:old?old.note:''}}commit()}
function setBoxQty(k,id,v){const b=db.wh[k].boxes[id];if(!b)return;b.qty=toInt(v);commit()}
function stepBox(k,id,d){const b=db.wh[k].boxes[id];if(!b)return;b.qty=Math.max(0,b.qty+d);commit()}
function setBoxNote(k,id,v){const b=db.wh[k].boxes[id];if(!b)return;b.note=v.slice(0,100);save()}
function clearBox(k,id){if(!confirm('이 박스를 비울까요?'))return;delete db.wh[k].boxes[id];commit()}
function newItemToBox(k,id){const el=$('bxNew'),name=el.value.trim();if(!name)return alert('품명을 입력하세요');if(!db.wh[k].items.some(x=>x.name===name))db.wh[k].items.push({name,min:0,unit:'개'});setBoxItem(k,id,name)}

function gunRows(){return Array.from({length:10},(_,i)=>{const ps=db.people.filter(p=>p.room===i+1);const c=k=>{const own=ps.filter(p=>p[k]==='개인보유');return{total:ps.filter(p=>p[k]!=='미지급').length,stored:ps.filter(p=>p[k]==='입고').length,owned:own.length,leave:own.filter(p=>p.status==='휴가중').length,away:own.filter(p=>p.status==='파견').length,none:ps.filter(p=>p[k]==='미지급').length}};return{room:i+1,g:c('weapon'),b:c('bayonet')}})}

  <div class="grid g2"><div><h3 style="margin-top:0">총기</h3>${tbl('g')}</div><div><h3 style="margin-top:0">대검</h3>${tbl('b')}</div></div>
  <h3>인원별 장부 상태 수정</h3><div class="seg">${Array.from({length:10},(_,i)=>`<button class="${gunRoom===i+1?'on':''}" onclick="gunRoom=${i+1};draw()">${i+1}생활관</button>`).join('')}</div>
  <div class="tw"><table><thead><tr><th>성명</th><th>계급</th><th>인사상태</th><th>총기</th><th>대검</th></tr></thead><tbody>${db.people.filter(p=>p.room===gunRoom).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.rank)}</td><td>${pill(p.status,p.status==='임무수행가능'?'ok':'warn')}</td><td><select onchange="setP(${p.id},'weapon',this.value)">${opts(GSTATE,p.weapon)}</select></td><td><select onchange="setP(${p.id},'bayonet',this.value)">${opts(GSTATE,p.bayonet)}</select></td></tr>`).join('')||'<tr><td colspan="5" class="empty">인원 없음</td></tr>'}</tbody></table></div></div>`}

  <label class="field">주요 증상 (200자)<textarea id="cSym" maxlength="200" placeholder="예: 배터리 방전, 시동 불량">${esc(v.symptom)}</textarea></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" onclick="saveCar(${s})">${v.number?'저장':'주차 등록'}</button>${v.number?`<button class="btn del" onclick="clearCar(${s})">출차·비우기</button>`:''}</div></div>`}
function saveCar(s){const v=car(s),num=$('cNum').value.trim(),type=$('cType').value;if(num&&!type)return alert('차량 종류를 선택하세요');if(!num&&type)return alert('차량번호를 입력하세요');Object.assign(v,{number:num,type,state:$('cState').value,mission:$('cMis').value==='1',symptom:$('cSym').value.slice(0,200)});commit()}

function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.people)||!v.facilities)throw Error('형식 불일치');if(!confirm('현재 데이터를 백업 파일로 바꿀까요?'))return;db=fixup(v);commit()}catch(err){alert('백업 파일 오류: '+err.message)}};r.readAsText(f);e.target.value=''}

function renderSheet(){if(!sheetFn)return;const sc=document.querySelector('.sheet')?.scrollTop||0;$('sheetRoot').innerHTML=`<div class="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet">${sheetFn()}</div></div>`;document.querySelector('.sheet').scrollTop=sc}
const sh=(title,right='')=>`<div class="shead"><h2>${title}</h2><div style="display:flex;gap:8px;align-items:center">${right}<button class="iconbtn" onclick="closeSheet()" title="닫기">✕</button></div></div>`;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

  return sh(`${WH[k].icon} ${WH[k].name} · ${wallName(w)} ${l}층 ${c}번`,b?pill('적재','ok'):pill('빈 칸','gray'))+
  `<div class="boxview">${icon}<div>${b?`<div class="muted small">이 박스에 들어 있는 것</div><div style="font-size:20px;font-weight:800;margin:2px 0">${esc(b.item)}</div><div><b style="font-size:18px">${fmt(b.qty)}</b> ${esc(it?.unit||'')}${it&&it.qty<it.min?' '+pill('창고 전체 부족','bad'):''}</div>`:`<div style="font-weight:800;font-size:16px">비어 있는 칸입니다</div><div class="muted small">아래에서 품목을 골라 넣으세요</div>`}</div></div>

  </div>

}

function sheetFaults(kind){
  const F=facBad(),C=carBad(),showF=kind!=='car',showC=kind!=='fac',showL=!kind;
  const title=kind==='fac'?'🏗️ 시설 고장현황':kind==='car'?'🚛 차량 고장현황':'🔴 고장·부족 전체현황';
  const fRows=F.map(f=>`<button class="fitem" onclick="openSheet(()=>sheetFac('${f.id}'))"><div class="ic" style="background:var(--badSoft)">${f.icon}</div><div style="flex:1"><b>${esc(f.name)} ${stPill(f.state)}</b><span>${esc(f.note||'내용 미기재')}</span></div><span class="small" style="color:var(--acc2);font-weight:700">수정 →</span></button>`).join('');
  const cRows=C.map(v=>`<button class="fitem" onclick="openSheet(()=>sheetCar(${v.slot}))"><div class="ic" style="background:var(--badSoft)">🚙</div><div style="flex:1"><b>${v.slot}번 ${esc(v.number)} · ${esc(v.type)} ${stPill(v.state)} ${v.mission?'':pill('임무불가','bad')}</b><span>${esc(v.symptom||'증상 미기재')}</span></div><span class="small" style="color:var(--acc2);font-weight:700">수정 →</span></button>`).join('');
  return sh(title)+
  (showF?`<div class="grp"><h4>시설 ${F.length?pill('불량 '+F.length,'bad'):pill('정상','ok')} <span class="muted small">정상 ${FAC.length-F.length}곳</span></h4><div class="feed">${fRows||'<div class="empty">고장 시설 없음</div>'}</div></div>`:'')+
  (showC?`<div class="grp"><h4>차량 ${C.length?pill('불량 '+C.length,'bad'):pill('정상','ok')} <span class="muted small">주차 ${cars().length}대 · 정상 ${cars().length-C.length}대</span></h4><div class="feed">${cRows||'<div class="empty">고장 차량 없음</div>'}</div></div>`:'')+
  (showL?`<div class="grp"><h4>부족 물자 ${lowItems().length?pill(lowItems().length+'종','bad'):pill('정상','ok')}</h4>${lowTable()}</div>`:'');
}
function lowTable(){const L=lowItems();return L.length?`<div class="tw"><table><thead><tr><th>창고</th><th>품명</th><th>보유</th><th>기준</th><th>부족</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td>${WH[x.cat].icon} ${WH[x.cat].name}</td><td><b>${esc(x.name)}</b></td><td>${fmt(x.qty)}</td><td>${fmt(x.min)}</td><td style="color:var(--bad);font-weight:700">${fmt(x.min-x.qty)}</td><td><button class="btn sm" onclick="closeSheet();supTab='${x.cat}';go('supply')">창고 보기</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">부족 물자 없음</div>'}
function sheetLow(){const it=allItems();return sh('📦 군수 물자 현황',pill(`정상 ${it.length-lowItems().length} · 부족 ${lowItems().length}`,lowItems().length?'bad':'ok'))+`<div class="grp"><h4>부족 품목</h4>${lowTable()}</div><div class="grp"><h4>창고별 품목</h4>${Object.keys(WH).map(k=>`<div class="small" style="font-weight:800;margin:10px 0 6px">${WH[k].icon} ${WH[k].name}</div>${itemTable(k,false)}`).join('')}</div>`}
function sheetFac(id){
  const f=FAC.find(x=>x[0]===id),d=db.facilities[id];let extra='';
  if(id.startsWith('room')){const n=Number(id.slice(4)),ps=db.people.filter(p=>p.room===n);extra=`<div class="grp"><h4>생활관 인원 ${pill(ps.length+'명','acc')} ${pill('열외 '+ps.filter(p=>p.status!=='임무수행가능').length,'warn')}</h4><div class="plist">${ps.map(p=>`<div class="pchip"><span><b>${esc(p.name)}</b> <span class="muted small">${esc(p.rank)}</span></span><select onchange="setP(${p.id},'status',this.value)">${opts(STATUS,p.status)}</select></div>`).join('')||'<div class="empty">인원 없음</div>'}</div></div>`}
  if(FAC_WH[id]){const k=FAC_WH[id];extra=`<div class="grp"><h4>${WH[k].name} 품목 ${pill(usedBoxes(k)+'/60 박스','acc')}</h4>${itemTable(k,false)}<div style="margin-top:10px"><button class="btn pri" onclick="closeSheet();supTab='${k}';go('supply')">3D 창고 보기 →</button></div></div>`}
  if(id==='garage')extra=`<div class="grp"><h4>주차장 ${pill('주차 '+cars().length+'/40','acc')} ${carBad().length?pill('불량 '+carBad().length,'bad'):''}</h4>${lotHTML(false,true)}</div>`;
  if(id==='dining')extra=`<div class="grp note">식수 예상 ${db.meal}명 · 잔반 ${db.waste}kg</div>`;
  return sh(`${f[2]} ${esc(f[1])}`,stPill(d.state))+`<div class="form">
    <label class="field">시설 상태<select id="fState">${opts(FSTATE,d.state)}</select></label>
    <label class="field">고장·점검 내용 (200자)<textarea id="fNote" maxlength="200" placeholder="고장 부위, 증상, 조치 요청사항">${esc(d.note)}</textarea></label>
    <div><button class="btn pri" onclick="saveFac('${id}')">상태 저장</button></div></div>${extra}
    <div class="grp"><h4>최근 이력</h4>${d.history.slice(-5).reverse().map(h=>`<div class="chk small">${esc(h)}</div>`).join('')||'<div class="muted small">기록 없음</div>'}</div>`;
}
function saveFac(id){const d=db.facilities[id];d.state=$('fState').value;d.note=$('fNote').value.slice(0,200);d.history.push(`${new Date().toLocaleString('ko-KR')} | ${d.state} | ${d.note||'-'}`);commit()}
function sheetCar(s){return sh(`🚛 ${s}번 주차면 <span class="muted small">${Math.ceil(s/10)}열</span>`)+carForm(s)}
function sheetQuick(){return sh('⚡ 빠른 작업')+`<div class="feed">
  <button class="fitem" onclick="closeSheet();go('person');setTimeout(()=>$('nName')?.focus(),50)"><div class="ic" style="background:var(--accSoft)">👤</div><div><b>인원 추가</b><span>명부에 새 인원 등록</span></div></button>
  <button class="fitem" onclick="openSheet(sheetLeave)"><div class="ic" style="background:var(--warnSoft)">🟠</div><div><b>열외현황</b><span>휴가·작업·외진·파견 등 세부</span></div></button>
  <button class="fitem" onclick="closeSheet();go('site')"><div class="ic" style="background:var(--badSoft)">🔧</div><div><b>고장 신고 · 차량 주차</b><span>시설·차량 상태 변경</span></div></button>
  <button class="fitem" onclick="closeSheet();supTab='general';go('supply')"><div class="ic" style="background:var(--okSoft)">📦</div><div><b>3D 창고 열기</b><span>박스별 내용물·수량 수정</span></div></button></div>`}

/* ───────── 시작 ───────── */
$('logoA').innerHTML=I.shield;cloudInit();$('logoB').innerHTML=I.shield;$('plus').innerHTML=I.plus;
draw();
</script>
